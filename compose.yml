services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: pi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abstencao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abstencao}
      POSTGRES_DB: ${POSTGRES_DB:-abstencao}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7
    container_name: pi_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
